plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/modern/java']
        resources {
            srcDirs = ['src/modern/resources', 'src/generated/resources']
            exclude 'mcmod.info'
            exclude 'assets/shincolle/blockstates/*[A-Z]*.json'
            exclude 'assets/shincolle/models/block/*[A-Z]*.json'
            exclude 'assets/shincolle/models/item/*[A-Z]*.json'
        }
    }
}

repositories {
    // ForgeGradle already adds the Forge and Maven Central repositories.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('src/main/java/com/lulan/shincolle/client/model') {
        include 'Model*.java'
        into 'assets/shincolle/legacy_model_sources'
        rename { fileName -> fileName.toLowerCase() }
    }
}

tasks.register('verifyItemModelCoverage') {
    group = 'verification'
    description = 'Ensures every registered modern item id has a lowercase item model json.'

    doLast {
        def modItemsSource = file('src/modern/java/com/lulan/shincolle/registry/ModItems.java').text
        def equipmentFamilySource = file('src/modern/java/com/lulan/shincolle/item/equipment/LegacyEquipmentFamily.java').text
        def modelRelativePath = 'assets/shincolle/models/item'
        def modelRoots = sourceSets.main.resources.srcDirs.collect { new File(it, modelRelativePath) }

        Set<String> expectedIds = new LinkedHashSet<>()

        (modItemsSource =~ /ITEMS\.register\("([a-z0-9_]+)"/).each { match ->
            expectedIds.add(match[1])
        }
        (modItemsSource =~ /\bregister\("([a-z0-9_]+)"\)/).each { match ->
            expectedIds.add(match[1])
        }

        def shipEggCall = (modItemsSource =~ /shipSpawnEggItems\(([\s\S]*?)\);/)
        if (shipEggCall.find()) {
            def shipEggArgs = shipEggCall.group(1)
            (shipEggArgs =~ /"([a-z0-9_]+)"/).each { match ->
                expectedIds.add(match[1])
            }
        }

        def familyPattern = ~/([A-Z0-9_]+)\("([a-z0-9_]+)",\s*keys\(([\s\S]*?)\)\s*(?:,\s*new int\[]\{[\s\S]*?\})?\)\s*(?:,|;)/
        (equipmentFamilySource =~ familyPattern).each { match ->
            def base = match[2]
            def keysChunk = match[3]
            def variantCount = (keysChunk =~ /"[^"]+"/).count

            (0..<variantCount).each { index ->
                expectedIds.add(index == 0 ? base : "${base}${index}")
            }
        }

        def missingModels = expectedIds.findAll { id ->
            !modelRoots.any { root ->
                new File(root, "${id}.json").exists()
            }
        }.sort()

        if (!missingModels.isEmpty()) {
            def preview = missingModels.take(30).join(', ')
            def roots = modelRoots.collect { it.path }.join('; ')
            throw new GradleException("Missing item model json for ${missingModels.size()} ids under ${roots}: ${preview}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyItemModelCoverage')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
